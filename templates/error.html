{% extends "base.html" %}
{% block title %}Ошибка {{ status }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="err-title">
  <p class="error-code" aria-hidden="true">{{ status }}</p>
  <h1 id="err-title">{{ message }}</h1>
  <p><a class="btn btn-primary" href="{{ url_for('pages.board') }}">На доску</a></p>
</section>
{% endblock %}
